name: Build Windows Desktop App

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: 检出仓库源码
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 编译前端静态页面
        shell: bash
        run: |
          cd frontend
          npm install --registry=https://registry.npmjs.org/
          npm install driver.js --save --registry=https://registry.npmjs.org/
          npm run generate
          cd ..

      - name: 编译后端服务（清除原作者私有源，强制走官方公网）
        shell: bash
        run: |
          cd backend
          # 清除包含私有源地址的旧锁文件，防止401鉴权拦截
          rm -f package-lock.json
          npm install --registry=https://registry.npmjs.org/
          cd ..
          
          # 创建打包所需缓存目录
          mkdir -p build/win-bin

      - name: 云端一键打包 Windows EXE 安装包
        shell: bash
        run: |
          # 根目录与桌面目录双重保障打包
          if [ -d "desktop" ]; then
            cd desktop
            rm -f package-lock.json
            npm install --registry=https://registry.npmjs.org/
            npm run dist:win || npx electron-builder --win
            cd ..
          else
            npm run dist:win || npx electron-builder --win
          fi

      - name: 收集并发布 EXE 安装程序
        uses: actions/upload-artifact@v4
        with:
          name: HUOLIENIAO-Windows-Installer
          path: |
            desktop/release/*.exe
            release/*.exe
            build/release/*.exe
            dist/*.exe
