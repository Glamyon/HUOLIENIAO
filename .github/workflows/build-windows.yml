name: Build Windows Desktop App

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: 检出仓库源码
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 编译前端静态页面
        shell: bash
        run: |
          cd frontend
          npm install --registry=https://registry.npmjs.org/
          npm install driver.js --save --registry=https://registry.npmjs.org/
          npm run generate
          cd ..

      - name: 编译后端服务
        shell: bash
        run: |
          cd backend
          rm -f package-lock.json
          npm install --registry=https://registry.npmjs.org/
          cd ..

      - name: 自动下载 Windows 原生二进制（FFmpeg 与 SQLite 预编译）
        shell: bash
        run: |
          mkdir -p build/win-bin
          mkdir -p desktop/build/win-bin
          
          echo "1. 下载 Windows FFmpeg..."
          curl -L -o desktop/build/win-bin/ffmpeg.exe https://github.com/eugeneware/ffmpeg-static/releases/download/b6.0/ffmpeg-win32-x64
          cp desktop/build/win-bin/ffmpeg.exe build/win-bin/ffmpeg.exe
          
          echo "2. 下载 Windows SQLite 官方预编译包..."
          curl -L -o sqlite.tar.gz https://github.com/WiseLibs/better-sqlite3/releases/download/v12.11.1/better-sqlite3-v12.11.1-electron-v136-win32-x64.tar.gz
          tar -xzf sqlite.tar.gz
          cp build/Release/better_sqlite3.node desktop/build/win-bin/better_sqlite3.node
          cp build/Release/better_sqlite3.node build/win-bin/better_sqlite3.node

      - name: 云端一键打包 Windows EXE 安装包
        shell: bash
        run: |
          cd desktop
          rm -f package-lock.json
          npm install --registry=https://registry.npmjs.org/
          npm run dist:win
          cd ..

      - name: 收集并发布 EXE 安装程序
        uses: actions/upload-artifact@v4
        with:
          name: HUOLIENIAO-Windows-Installer
          path: |
            desktop/release/*.exe
            release/*.exe
            build/release/*.exe
