name: Build Windows Desktop App

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: 检出仓库源码
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装各模块依赖并构建
        shell: bash
        run: |
          echo "=== 1. 安装根目录依赖 ==="
          npm install
          
          echo "=== 2. 安装并编译前端 ==="
          cd frontend && npm install && npm run generate && cd ..
          
          echo "=== 3. 安装后端依赖 ==="
          cd backend && npm install && cd ..
          
          echo "=== 4. 检查桌面端依赖 ==="
          if [ -d "desktop" ]; then
            cd desktop && npm install && cd ..
          fi

      - name: 云端一键打包 Windows EXE 安装包
        shell: bash
        run: |
          npm run dist:win

      - name: 收集并发布 EXE 安装程序
        uses: actions/upload-artifact@v4
        with:
          name: HUOLIENIAO-Windows-Installer
          path: |
            desktop/release/*.exe
            release/*.exe
            build/release/*.exe
