name: Build Windows Desktop App

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: 检出仓库源码
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 编译前端静态页面
        run: |
          cd frontend
          npm install
          npm run generate

      - name: 安装后端依赖
        run: |
          cd backend
          npm install

      - name: 云端一键打包 Windows EXE 安装包
        run: |
          npm install
          npm run dist:win

      - name: 收集并发布 EXE 安装程序
        uses: actions/upload-artifact@v4
        with:
          name: HUOLIENIAO-Windows-Installer
          path: |
            desktop/release/*.exe
            release/*.exe
            build/release/*.exe
